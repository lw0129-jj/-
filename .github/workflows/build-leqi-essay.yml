name: Build Leqi Essay APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: leqi-essay-v15
        run: gradle :app:assembleDebug --stacktrace

      - name: Dump manifest and package info
        run: |
          APK=leqi-essay-v15/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee leqi-essay-v15/aapt-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump xmltree "$APK" AndroidManifest.xml | tee leqi-essay-v15/manifest-tree.txt

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: leqi-essay-apk
          path: |
            leqi-essay-v15/app/build/outputs/apk/debug/app-debug.apk
            leqi-essay-v15/aapt-badging.txt
            leqi-essay-v15/manifest-tree.txt
          if-no-files-found: error
